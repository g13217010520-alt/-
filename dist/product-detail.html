<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#080a08" />
    <meta name="description" content="JIAYI POWER 产品详情与交互式 3D 展示。" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080a08'/%3E%3Cpath d='M8 8h7v10c0 5-2 7-7 7v-5c2 0 3-1 3-3V8Zm9 0h7l-2 17h-5V8Z' fill='%2399ff42'/%3E%3C/svg%3E" />
    <title>产品详情 · JIAYI POWER</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="detail-page">
    <a class="skip-link" href="#detail-main">跳至产品详情</a>
    <header class="detail-header">
      <a class="brand" href="company.html" aria-label="返回 JIAYI POWER 首页">
        <img class="brand__logo" src="assets/jiayi-logo.svg" alt="JIAYI POWER" />
      </a>
      <a class="detail-header__back" href="company.html#products">返回产品矩阵</a>
    </header>

    <main id="detail-main">
      <section class="detail-hero">
        <div class="detail-copy reveal">
          <p class="detail-breadcrumb"><a href="company.html">首页</a><span>/</span><a href="company.html#products">产品</a><span>/</span><span data-product-model>JY</span></p>
          <p class="eyebrow" data-product-category>Product</p>
          <h1 data-product-name>智能割草机器人</h1>
          <p class="detail-lead" data-product-summary></p>
          <div class="detail-actions">
            <a class="button button--primary" href="mailto:sales@jiayipower.com?subject=JIAYI%20POWER%20Product%20Inquiry" data-product-contact>获取产品方案</a>
            <a class="text-link" href="assets/jiayi-2026-catalog.pdf" download>下载完整图册</a>
          </div>
        </div>

        <div class="viewer-shell reveal reveal--delay-1" data-viewer>
          <div class="viewer-toolbar">
            <span><i></i> Interactive 3D View</span>
            <button type="button" data-viewer-reset>重置视角</button>
          </div>
          <div class="viewer-stage" tabindex="0" role="application" aria-label="可拖拽旋转的产品立体展示，使用方向键也可调整角度">
            <div class="viewer-grid" aria-hidden="true"></div>
            <div class="viewer-orbit viewer-orbit--one" aria-hidden="true"></div>
            <div class="viewer-orbit viewer-orbit--two" aria-hidden="true"></div>
            <div class="viewer-object" data-viewer-object>
              <span class="viewer-shadow" aria-hidden="true"></span>
              <img data-product-image src="assets/mower.webp" alt="" draggable="false" />
              <span class="viewer-glare" data-viewer-glare aria-hidden="true"></span>
            </div>
            <div class="viewer-hint"><span>拖拽</span> 旋转与观察产品</div>
          </div>
        </div>
      </section>

      <section class="series-section" id="series" aria-labelledby="series-title">
        <div class="series-heading">
          <div>
            <p class="eyebrow">Complete Series / 完整系列</p>
            <h2 id="series-title"><span data-series-name>产品</span><br />全系列。</h2>
          </div>
          <p data-series-summary>同一品类下的每个型号均以独立大幅详情呈现，可连续向下浏览并交互观察。</p>
        </div>
        <div class="series-grid" data-series-grid></div>
      </section>

      <section class="product-switcher" aria-labelledby="switcher-title">
        <div class="product-switcher__heading">
          <p class="eyebrow">Explore the range</p>
          <h2 id="switcher-title">切换产品，继续探索。</h2>
        </div>
        <div class="product-switcher__grid" data-product-switcher></div>
      </section>
    </main>

    <footer class="detail-footer">
      <span>Yongkang · Zhejiang · China</span>
      <a href="mailto:sales@jiayipower.com" data-product-footer-email>sales@jiayipower.com</a>
      <span>© 2026 JIAYI POWER</span>
    </footer>
    <script src="app.js" defer></script>
    <script src="product-detail.js" type="module"></script>
  </body>
</html>
